name: Publish Rust Client

run-name: Publish Rust Client (${{ inputs.level }}${{ inputs.dry_run && ', dry run' || '' }})

on:
  workflow_dispatch:
    inputs:
      client:
        description: Client to publish
        required: true
        type: choice
        options: [rust-identity, rust-reputation, rust-validation, rust-tools]
      level:
        description: Level
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, rc, beta, alpha, release, version]
      version:
        description: Version (when level is `version`)
        required: false
        type: string
      dry_run:
        description: Dry run
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  # One Rust publish per crate at a time.
  group: publish-rust-client-${{ inputs.client }}
  cancel-in-progress: false

jobs:
  build_programs:
    name: Programs
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: read
    with:
      apt_packages: protobuf-compiler

  build_rust_client:
    name: Rust client
    uses: metaplex-foundation/actions/.github/workflows/build-rust-client.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: read
    with:
      apt_packages: protobuf-compiler
      client_matrix: '["clients/rust-identity", "clients/rust-reputation", "clients/rust-validation", "clients/rust-tools"]'
      features: --all-features

  test_rust_client:
    name: Rust client
    needs: [build_programs, build_rust_client]
    uses: metaplex-foundation/actions/.github/workflows/test-rust-client.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: read
    with:
      apt_packages: protobuf-compiler
      client_dir: clients

  publish:
    name: Rust client
    needs: test_rust_client
    uses: metaplex-foundation/actions/.github/workflows/publish-rust-client.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: write
      pull-requests: write
    secrets:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    with:
      level: ${{ inputs.level }}
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      client_dir: ${{ inputs.client == 'rust-identity' && 'clients/rust-identity' || inputs.client == 'rust-reputation' && 'clients/rust-reputation' || inputs.client == 'rust-validation' && 'clients/rust-validation' || inputs.client == 'rust-tools' && 'clients/rust-tools' || '' }}
